<div class="courses-panel">

  <h3>All Courses</h3>

  <button class="btn">
    Add Course
  </button>

  <mat-tab-group>

    <mat-tab label="Beginners">
      @for (course of courses(); track course.id) {
      <p>{{course.title}}</p>
      }



    </mat-tab>

    <mat-tab label="Advanced">


    </mat-tab>

  </mat-tab-group>

</div>
