<div class="courses-panel">

  <h3>All Courses</h3>

  <button class="btn">
    Add Course
  </button>

  <mat-tab-group>

    <mat-tab label="Beginners">
      @for (course of beginnerCourses(); track course.id) {
        <courses-card-list [inputData]="beginnerCourses()" (onDeleteCourse)="deleteCourse(course)"/>
      }
    </mat-tab>

    <mat-tab label="Advanced">
      @for (course of advancedCourses(); track course.id) {
        <courses-card-list [inputData]="advancedCourses()" (onDeleteCourse)="deleteCourse(course)"/>
      }

    </mat-tab>

  </mat-tab-group>

</div>
